name: deploy

on:
  workflow_dispatch:
    inputs:
      metro:
        description: "region (sin / fra / sfo / was / dal)"
        required: false
        default: "sin"
      action:
        description: "action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - destroy
          - status

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UKC_ORG: pangouai
      UKC_NAME: relay
    steps:
      - uses: actions/checkout@v4

      - name: install cli
        run: |
          set -euo pipefail
          VER=v0.6.2
          curl -sSL -o cli.tar.gz \
            "https://github.com/unikraft-cloud/cli/releases/download/${VER}/unikraft-cli_0.6.2_linux_amd64.tar.gz"
          tar -xzf cli.tar.gz
          chmod +x unikraft
          sudo mv unikraft /usr/local/bin/unikraft
          unikraft version

      - name: login
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$UKC_TOKEN" | unikraft login --token - --no-browser
          unikraft images list || true

      - name: status
        if: inputs.action == 'status'
        run: |
          unikraft instances list --metro "${{ inputs.metro }}"
          unikraft services list --metro "${{ inputs.metro }}"
          unikraft images list

      - name: destroy
        if: inputs.action == 'destroy'
        run: |
          unikraft instances delete "$UKC_NAME" --metro "${{ inputs.metro }}" -f || true
          unikraft services delete "$UKC_NAME" --metro "${{ inputs.metro }}" -f || true

      - name: build
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          unikraft build ./app --arch x86_64 --output ./out.tar
          ls -lh out.tar

      - name: push image
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          unikraft images copy ./out.tar "unikraft.io/${UKC_ORG}/${UKC_NAME}:latest"
          unikraft images list | head -20

      - name: deploy
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          unikraft run \
            --metro "${{ inputs.metro }}" \
            --name "$UKC_NAME" \
            --image "${UKC_ORG}/${UKC_NAME}:latest" \
            -m 128MiB \
            --vcpus 1 \
            -p 8443:8443/tls \
            --restart always \
            -e PORT=8443

      - name: output
        if: inputs.action == 'deploy'
        run: |
          unikraft instances list --metro "${{ inputs.metro }}"
          unikraft services list --metro "${{ inputs.metro }}"
